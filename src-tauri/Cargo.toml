[package]
name = "planner"
version = "0.1.0"
description = "Planificador Semanal — tareas, hábitos y exportación a PDF"
authors = ["Gabriel Cat Developer"]
edition = "2021"
rust-version = "1.99"

# Resuelve el problema de "multiple `Cargo.toml`s in the workspace" en
# algunos IDEs cuando se usa un solo crate en src-tauri/.
[lib]
name = "planner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Binario principal (en Android Tauri usa lib directamente).
[[bin]]
name = "planner"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"                # build.rs incrusta las claves de anuncios desde .env
serde_json = "1"                # build.rs lee csp.json y genera el TAURI_CONFIG

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"        # necesario para abrir enlaces externos (política de privacidad, etc.)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-admob = { path = "plugins/tauri-plugin-admob" }   # AdMob nativo (solo actúa en Android)

# Dependencias del servidor MCP local (Streamable HTTP) para T-009.
# Solo se compilan en escritorio: en Android/iOS no hay servidor.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rmcp = { version = "0.5", default-features = false, features = [
    "base64",
    "server",
    "macros",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
    "transport-worker",
    "schemars",
] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "macros"] }
axum = "0.8"
# Entropía criptográfica para el token Bearer del servidor MCP. Sin
# dependencias extra: usa el generador del sistema (getrandom/urandom).
getrandom = "0.3"

[features]
# Esta feature la usa Tauri internamente; definirla aquí evita warnings.
custom-protocol = ["tauri/custom-protocol"]

# Optimización de release: tamaño más pequeño.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
