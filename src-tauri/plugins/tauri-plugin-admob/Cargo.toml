[package]
name = "tauri-plugin-admob"
version = "0.1.0"
description = "Puente mínimo entre el WebView y Google Mobile Ads (AdMob) en Android"
edition = "2021"
rust-version = "1.77"
# Necesario para que tauri-build encuentre la carpeta android/ del plugin.
links = "tauri-plugin-admob"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
