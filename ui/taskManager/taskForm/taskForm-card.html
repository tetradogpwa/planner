<div class="task-form">
  <div class="form-row">
    <div class="form-group">
      <label for="{{nameId}}">Nombre</label>
      <input type="text" id="{{nameId}}" placeholder="Ej: Gym">
    </div>
    <div class="form-group form-group--small">
      <label for="{{timesId}}">Veces/día</label>
      <input type="number" id="{{timesId}}" value="1" min="1">
    </div>
  </div>

  <div class="form-group" role="radiogroup" aria-labelledby="{{repeatLabelId}}">
    <span class="form-group-label" id="{{repeatLabelId}}">Tipo de repetición</span>
    <div class="repeat-options">
      <label class="repeat-option">
        <input type="radio" name="{{repeatName}}" value="no-repeat">
        <span>Sin repetición</span>
      </label>
      <label class="repeat-option">
        <input type="radio" name="{{repeatName}}" value="daily">
        <span>Diario</span>
      </label>
      <label class="repeat-option">
        <input type="radio" name="{{repeatName}}" value="interval">
        <span>Cada N días</span>
      </label>
      <label class="repeat-option">
        <input type="radio" name="{{repeatName}}" value="days">
        <span>Días específicos</span>
      </label>
      <label class="repeat-option">
        <input type="radio" name="{{repeatName}}" value="cycle">
        <span>Ciclo</span>
      </label>
    </div>
  </div>

  <div id="{{extraId}}"></div>
</div>
