<div class="task-manager">
  <div id="addTaskMount"></div>

  <div class="list-header">
    <h3 id="view-tasks-heading" tabindex="-1">Tareas <span id="taskCount" class="badge-count">0</span></h3>
    <label class="switch-row">
      <span>Gestionar</span>
      <div class="switch">
        <input type="checkbox" id="editToggle">
        <span class="slider"></span>
      </div>
    </label>
  </div>

  <div id="taskListMount"></div>

  <!-- Aviso de que la tarea se ha guardado: es una región role="status"
       que vive siempre en el DOM (reserva su sitio aunque esté vacía)
       para que los lectores de pantalla la anuncien al cambiar su
       texto. -->
  <p id="taskStatus" class="task-status" role="status"></p>
</div>
