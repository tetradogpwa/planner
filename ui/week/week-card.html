<div class="week-card">
  <div class="week-title-region">
    <h3 class="week-title"></h3>
  </div>
  <div class="calendar-grid">
    <!-- sin cabeceras, van dentro de cada celda -->
    <div class="days-container"></div>
  </div>
  <!-- Estado vacío (T-056): se ve en vez de los siete días cuando
       todavía no hay ninguna tarea. Sin ids: esta tarjeta se pinta
       también en la vista de todas las semanas (doce tarjetas). -->
  <div class="estado-vacio" hidden>
    <h4 class="estado-vacio-titulo">Esta semana está vacía</h4>
    <p>Aquí verás, día a día, lo que tienes pendiente y qué ya has hecho. En cuanto crees tu primera tarea, aparecerá en su día y podrás marcarla como hecha.</p>
    <button type="button" class="estado-vacio-btn">Crear la primera tarea</button>
  </div>
</div>
