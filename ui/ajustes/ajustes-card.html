<div class="ajustes-card">
  <h2 id="view-ajustes-heading" tabindex="-1">
    <span aria-hidden="true">⚙️</span> Ajustes
  </h2>

  <div class="ajustes-tabs" role="tablist" aria-label="Pestañas de Ajustes">
    <button class="ajustes-tab" role="tab" id="ajustes-tab-appearance"
            data-tab="appearance" aria-controls="ajustes-panel-appearance"
            aria-selected="true" tabindex="0">
      Apariencia
    </button>
    <button class="ajustes-tab" role="tab" id="ajustes-tab-accessibility"
            data-tab="accessibility" aria-controls="ajustes-panel-accessibility"
            aria-selected="false" tabindex="-1">
      Accesibilidad
    </button>
    <button class="ajustes-tab" role="tab" id="ajustes-tab-data"
            data-tab="data" aria-controls="ajustes-panel-data"
            aria-selected="false" tabindex="-1">
      Datos
    </button>
    <button class="ajustes-tab" role="tab" id="ajustes-tab-print"
            data-tab="print" aria-controls="ajustes-panel-print"
            aria-selected="false" tabindex="-1">
      Imprimir y PDF
    </button>
    <button class="ajustes-tab" role="tab" id="ajustes-tab-mcp"
            data-tab="mcp" aria-controls="ajustes-panel-mcp"
            aria-selected="false" tabindex="-1">
      Asistente (MCP)
    </button>
    <button class="ajustes-tab" role="tab" id="ajustes-tab-legal"
            data-tab="legal" aria-controls="ajustes-panel-legal"
            aria-selected="false" tabindex="-1">
      Legal
    </button>
  </div>

  <article class="ajustes-panel" role="tabpanel" tabindex="-1"
           id="ajustes-panel-appearance" aria-labelledby="ajustes-tab-appearance"
           data-panel="appearance"></article>
  <article class="ajustes-panel" role="tabpanel" tabindex="-1"
           id="ajustes-panel-accessibility" aria-labelledby="ajustes-tab-accessibility"
           data-panel="accessibility" hidden></article>
  <article class="ajustes-panel" role="tabpanel" tabindex="-1"
           id="ajustes-panel-data" aria-labelledby="ajustes-tab-data"
           data-panel="data" hidden></article>
  <article class="ajustes-panel" role="tabpanel" tabindex="-1"
           id="ajustes-panel-print" aria-labelledby="ajustes-tab-print"
           data-panel="print" hidden></article>
  <article class="ajustes-panel" role="tabpanel" tabindex="-1"
           id="ajustes-panel-mcp" aria-labelledby="ajustes-tab-mcp"
           data-panel="mcp" hidden></article>
  <article class="ajustes-panel" role="tabpanel" tabindex="-1"
           id="ajustes-panel-legal" aria-labelledby="ajustes-tab-legal"
           data-panel="legal" hidden></article>
</div>
