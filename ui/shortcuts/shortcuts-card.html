<div class="shortcuts-modal" id="shortcuts-modal" hidden role="dialog"
     aria-modal="true" aria-labelledby="shortcuts-title">
  <div class="shortcuts-content" tabindex="-1">
    <header>
      <h3 id="shortcuts-title">Atajos de teclado</h3>
      <button type="button" class="shortcuts-close" id="shortcuts-close"
              aria-label="Cerrar">✕</button>
    </header>
    <!-- Intro específica del diálogo. En la vista Accesibilidad esta
         nota no aplica (Esc no cierra nada), por eso vive aquí y no
         en shortcuts-list.html, que es compartido. -->
    <div class="shortcuts-body" id="shortcuts-body">
      <p class="shortcuts-intro">
        La tecla <kbd>?</kbd> abre esta ayuda desde cualquier pantalla;
        <kbd>Esc</kbd> la cierra.
      </p>
    </div>
  </div>
</div>
