
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador Semanal Profesional</title>
  <script src="./theme-boot.js"></script>
  <script src="./vendor/html2pdf.bundle.min.js" defer></script>
  <link rel="stylesheet" href="index.css">
  <meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planificador">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192x192.png">
</head>

<body class="booting">

<!-- "Saltar al contenido" como primer elemento enfocable. Solo se
     ve al recibir foco de teclado (no al tabular por enlaces de
     lector de pantalla, porque va antes de los demás). -->
<a class="skip-link" href="#main-content">Saltar al contenido</a>

<header class="topbar">
  <button class="hamburger" id="menuToggle" aria-label="Abrir menú" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <h1>📅 Planner</h1>
  <div class="topbar-spacer"></div>
</header>

<!-- Overlay para cerrar el menú en mobile -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Navegación principal">

    <div class="sidebar-nav">
      <button class="nav-item active" data-view="tasks">
        <span class="nav-icon" aria-hidden="true">🧩</span>
        <span class="nav-label">Gestión tareas</span>
      </button>
      <button class="nav-item" data-view="week">
        <span class="nav-icon" aria-hidden="true">📆</span>
        <span class="nav-label">Semana actual</span>
      </button>
      <button class="nav-item" data-view="allWeeks">
        <span class="nav-icon" aria-hidden="true">📊</span>
        <span class="nav-label">Todas semanas</span>
      </button>

      <hr class="sidebar-divider"/>

      <button class="nav-item" data-view="data">
        <span class="nav-icon" aria-hidden="true">💾</span>
        <span class="nav-label">Gestión datos</span>
      </button>
      <button class="nav-item" data-view="print">
        <span class="nav-icon" aria-hidden="true">🖨️</span>
        <span class="nav-label">Imprimir / PDF</span>
      </button>

      <hr class="sidebar-divider"/>

      <button class="nav-item" data-view="settings">
        <span class="nav-icon" aria-hidden="true">🎨</span>
        <span class="nav-label">Apariencia</span>
      </button>
      <button class="nav-item" id="removeAdsBtn" hidden>
        <span class="nav-icon" aria-hidden="true">🚫</span>
        <span class="nav-label">Quitar anuncios</span>
      </button>
      <button class="nav-item" data-view="legal">
        <span class="nav-icon" aria-hidden="true">📜</span>
        <span class="nav-label">Legal y privacidad</span>
      </button>
      <button class="nav-item" data-view="accessibility">
        <span class="nav-icon" aria-hidden="true">♿</span>
        <span class="nav-label">Accesibilidad</span>
      </button>
    </div>

    <!-- Botón de colapso (solo desktop) -->
    <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Contraer menú">
      <span class="collapse-icon" aria-hidden="true">◀</span>
      <span class="nav-label">Contraer</span>
    </button>

  </nav>

  <main class="content" id="main-content" tabindex="-1">
    <section id="view-tasks"    class="view active" aria-labelledby="view-tasks-heading"></section>
    <section id="view-week"     class="view"></section>
    <section id="view-allWeeks" class="view" aria-labelledby="view-allWeeks-heading"></section>
    <section id="view-data"     class="view" aria-labelledby="view-data-heading"></section>
    <section id="view-print"    class="view" aria-labelledby="view-print-heading"></section>
    <section id="view-legal"    class="view" aria-labelledby="view-legal-heading"></section>
    <section id="view-settings" class="view" aria-labelledby="view-settings-heading"></section>
    <section id="view-accessibility" class="view" aria-labelledby="view-accessibility-heading"></section>
  </main>

  <!-- Región aria-live para anuncios de la API (cambios hechos por
       un script, p. ej. PlannerApi.addTask). Los lectores de pantalla
       leerán lo que pongamos aquí tras cada `planner:changed`. -->
  <div id="plannerStatus" role="status" aria-live="polite" class="sr-only"></div>
</div>

<!-- Pantallas previas a la app: términos (ui/terms/) y anuncios (ui/consent/) -->
<div id="terms-gate" class="gate-root"></div>
<div id="consent-gate" class="gate-root"></div>

<script type="module" src="./index.js"></script>
</body>
</html>
